<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buka Kalkulator Binaan Pro</title>
    <script>
        window.onload = function() {
            // Skrip ini akan terus menolak pengguna ke halaman Play Store anda.
            // Buat masa ini, kita guna link contoh. Anda boleh tukar 'com.kalkulatorbinaan.pro' 
            // kepada ID aplikasi sebenar anda apabila ia sudah live di Play Store.
            var playStoreLink = "https://play.google.com/store/apps/details?id=com.kalkulatorbinaan.pro";
            
            // Tunggu 1 saat (beri peluang jika app ada untuk buka dahulu), jika tidak, pergi Play Store
            setTimeout(function() {
                window.location.href = playStoreLink;
            }, 1000);
        };
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .spinner { margin-top: 20px; border: 4px solid #f3f3f3; border-top: 4px solid #2e7d32; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h2>Membuka Aplikasi...</h2>
        <p>Sila tunggu sebentar.</p>
        <div class="spinner"></div>
        <p style="font-size: 12px; color: gray; margin-top: 20px;">Jika anda tiada aplikasi, anda akan dibawa ke Google Play Store secara automatik.</p>
    </div>
</body>
</html>
